# -----------------------------
# Terminal / color support
# -----------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:RGB'
set -as terminal-overrides ',xterm*:sitm=\E[3m'

set -g mouse on
set-option -g focus-events on

# Improve responsiveness
set -s escape-time 0
set -g repeat-time 0

# -----------------------------
# Gruvbox Dark top status bar
# No arrow / powerline separators
# -----------------------------
set-option -g status-position top

# Main status bar
set -g status-style "bg=#282828,fg=#ebdbb2"

# Left: session name
set -g status-left-length 30
set -g status-left '#[fg=#282828,bg=#fabd2f,bold] #S #[fg=#ebdbb2,bg=#282828] '

# Window status
setw -g window-status-separator " "

setw -g window-status-format '#[fg=#ebdbb2,bg=#3c3836] #I #W '

setw -g window-status-current-format '#[fg=#282828,bg=#b8bb26,bold] #I #W '

# Right: machine label, time, date
set -g status-right-length 60
set -g status-right '#[fg=#282828,bg=#fe8019,bold] LabWS #[fg=#282828,bg=#83a598] %H:%M #[fg=#282828,bg=#8ec07c] %Y-%m-%d '

# -----------------------------
# Reload binding
# -----------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# -----------------------------
# Prefix
# -----------------------------
unbind C-b
set-option -g prefix C-a

# -----------------------------
# Tree / session picker
# -----------------------------
bind i choose-tree -Zs

# -----------------------------
# Vim-style pane navigation
# -----------------------------
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r x kill-pane

# -----------------------------
# Arrow key pane navigation
# -----------------------------
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r Left select-pane -L
bind -r Right select-pane -R

# -----------------------------
# Window management
# -----------------------------
bind -r n new-window -c "#{pane_current_path}"
bind -r w kill-window

bind -r S-Left previous-window
bind -r S-Right next-window

bind -r Tab next-window
bind -r BTab previous-window

# -----------------------------
# Splits
# Shift+E: vertical split
# Shift+O: horizontal split
# -----------------------------
bind -r E split-window -v -c "#{pane_current_path}"
bind -r O split-window -h -c "#{pane_current_path}"

# -----------------------------
# Window numbering
# -----------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g automatic-rename-format "#{window_index}"

# -----------------------------
# Environment forwarding
# -----------------------------
set-option -ga update-environment "DISPLAY"
